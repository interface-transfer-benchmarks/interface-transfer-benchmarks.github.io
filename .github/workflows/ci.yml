name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"

      - uses: julia-actions/cache@v2

      - run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'

      - run: julia --project=docs scripts/validate.jl

      - run: julia --project=docs scripts/generate_index.jl

      - name: Check index.md is in sync
        run: |
          git diff --exit-code -- index.md \
            || { echo "::error::Run scripts/generate_index.jl and commit."; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install matplotlib mpmath

      - run: julia --project=docs scripts/validate_results.jl

      - run: python3 scripts/plot_reference_figures.py

      - name: Check reference data is in sync
        run: |
          git diff --exit-code -- data/ \
            || { echo "::error::Run scripts/plot_reference_figures.py and commit."; exit 1; }

      - run: python3 scripts/plot_results.py

      - run: julia --project=docs docs/make.jl

      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: docs/build

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
